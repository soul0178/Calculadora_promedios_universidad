<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Libreta2 — Calculadora de notas</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#132019" id="theme-color-meta">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Libreta2">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<!-- Sincronización en la nube (opcional): sin configurar js/firebase-config.js, estos
     scripts cargan pero cloud-sync.js no hace nada y la app sigue funcionando 100% local. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// Fija el tema (oscuro/claro) antes de pintar, para evitar parpadeo.
(function(){
  try{
    var saved = localStorage.getItem('libreta-notas-theme');
    var theme = saved==='light' || saved==='dark'
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
    var meta = document.getElementById('theme-color-meta');
    if(meta) meta.setAttribute('content', theme==='light' ? '#f2efe4' : '#132019');
  }catch(e){}
})();
</script>
</head>
<body>
<div id="app"></div>

<!-- El orden importa: cada archivo depende de lo definido en los anteriores. -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/calc.js"></script>
<script src="js/semesters-courses.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
<script src="js/modals.js"></script>
<script src="js/import-export.js"></script>
<script src="js/pdf-report.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
